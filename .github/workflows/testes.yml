# Roda os testes automaticamente a cada push e pull request.
name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    runs-on: ubuntu-latest

    # Testa em várias versões do Python: o README promete suporte ao 3.10+.
    # Os testes não usam o token nem a internet, então não há segredo nenhum aqui.
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Baixar o código
        uses: actions/checkout@v5

      - name: Instalar o Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências de desenvolvimento
        run: pip install -r requirements-dev.txt

      - name: Rodar os testes
        run: pytest -v
